services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  mock-provider:
    build: mock_provider
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/chat/completions', json.dumps({'model':'test','messages':[{'role':'user','content':'hi'}]}).encode())"]
      interval: 3s
      timeout: 3s
      retries: 10

  proxy:
    build:
      context: ..
      dockerfile: Dockerfile.proxy
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgresql://test:test@postgres-test:5432/test
      REDIS_URL: redis://redis-test:6379
      PROVIDER_BASE_URL: http://mock-provider:8000/v1
      PROVIDER_API_KEY: test-provider-key
      INPUT_PRICE_PER_M: "0.15"
      OUTPUT_PRICE_PER_M: "0.60"
      RPM_LIMIT: "5"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      mock-provider:
        condition: service_started
