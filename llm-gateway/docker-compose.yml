services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - MODEL_NAME=${VLLM_MODEL:-minimax/MiniMax-M2}
      - TENSOR_PARALLEL_SIZE=${TENSOR_PARALLEL_SIZE:-1}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.9}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-8192}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command:
      - --model
      - ${VLLM_MODEL:-minimax/MiniMax-M2}
      - --tensor-parallel-size
      - ${TENSOR_PARALLEL_SIZE:-1}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.9}
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
      - --port
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - VLLM_BASE_URL=http://vllm:8000
      - MODEL_NAME=${MODEL_NAME:-minimax-2.7}
      - INPUT_PRICE_PER_M=${INPUT_PRICE_PER_M:-0.15}
      - OUTPUT_PRICE_PER_M=${OUTPUT_PRICE_PER_M:-0.60}
      - RPM_LIMIT=${RPM_LIMIT:-60}
      - TPM_LIMIT=${TPM_LIMIT:-300000}
    depends_on:
      - redis
      - vllm
