# Dev app. At cutover this process takes over the public app name so the URL
# https://superstackai-gateway.fly.dev stays the same (LiteLLM moves internal).
app = 'superstackai-queue'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
